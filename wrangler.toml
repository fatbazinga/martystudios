# ⚠️ "name" must be EXACTLY the name of your Worker in the Cloudflare dashboard
name = "martyrstudios"
main = "src/worker.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "martyrstudios"
database_id = "290fcf85-4e46-4c39-a17a-bd5656eed36d"
migrations_dir = "migrations"

[observability]
enabled = true

[vars]
ADMIN_EMAIL = "michael.z.daher@gmail.com"
